apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 1

  image:
    application: confluentinc/cp-server:8.3.0
    init: confluentinc/confluent-init-container:3.4.0

  dataVolumeCapacity: 10Gi

  storageClass:
    name: standard

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
        namespace: confluent
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: kafka-client-credentials
        tls:
          enabled: true

  tls:
    autoGeneratedCerts: true

  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: kafka-client-credentials
      tls:
        enabled: true

    external:
      authentication:
        type: plain
        jaasConfig:
          secretRef: kafka-client-credentials
      tls:
        enabled: true
      externalAccess:
        type: nodePort
        nodePort:
          host: kafka.minikube.test
          nodePortOffset: 30000
