apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: kafka-rbac-rest
  namespace: confluent
spec:
  kafkaClusterRef:
    name: kafka-rbac
    namespace: confluent
  kafkaRest:
    endpoint: https://kafka-rbac.confluent.svc.cluster.local:8090
    authentication:
      type: mtls
      sslClientAuthentication: true
    tls:
      secretRef: kafka3-rbac-admin-mtls
